spring:
  application:
    name: jsmd
  task:
    scheduling:
      pool:
        size: 2  # scan and extraction drain must not block each other
  datasource:
    url: ${JSMD_DB_URL:jdbc:postgresql://localhost:5432/jsmd}
    username: ${JSMD_DB_USER:jsmd}
    password: ${JSMD_DB_PASSWORD:jsmd}
  docker:
    compose:
      enabled: false  # only the dev profile starts docker-compose.yml
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

jsmd:
  scan:
    enabled: ${JSMD_SCAN_ENABLED:true}
    directories: ${JSMD_SCAN_DIRECTORIES:}
    interval: ${JSMD_SCAN_INTERVAL:PT5M}
    settle-time: ${JSMD_SCAN_SETTLE_TIME:PT5S}
  queue:
    retry-delay: ${JSMD_QUEUE_RETRY_DELAY:PT1M}
    max-attempts: ${JSMD_QUEUE_MAX_ATTEMPTS:5}
    claim-timeout: ${JSMD_QUEUE_CLAIM_TIMEOUT:PT15M}
    retention: ${JSMD_QUEUE_RETENTION:P7D}
    cleanup-cron: ${JSMD_QUEUE_CLEANUP_CRON:0 30 3 * * *}
  extract:
    enabled: ${JSMD_EXTRACT_ENABLED:true}
    poll-interval: ${JSMD_EXTRACT_POLL_INTERVAL:PT10S}
    ocr-languages: ${JSMD_EXTRACT_OCR_LANGUAGES:en}
    tessdata-path: ${JSMD_EXTRACT_TESSDATA_PATH:}
    tesseract-library: ${JSMD_EXTRACT_TESSERACT_LIBRARY:libtesseract.so.5.5}
    render-dpi: ${JSMD_EXTRACT_RENDER_DPI:300}
