services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jsmd
      POSTGRES_USER: ${JSMD_DB_USER:-jsmd}
      POSTGRES_PASSWORD: ${JSMD_DB_PASSWORD:-jsmd}
    ports:
      - "5432:5432"
    volumes:
      - jsmd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jsmd-pgdata:
